<main class="auth-shell"><a href="index.html" class="auth-logo">NOIR</a><div class="auth-card"><span class="eyebrow dark">JOIN NOIR</span><h1>Create your account.</h1><p>Save your preferences and keep your next drive close. You’ll be taken straight to the NOIR home page after creating your account.</p><form id="signup-form"><label>Full name<input type="text" required placeholder="Your name"></label><label>Email<input type="email" required placeholder="you@example.com"></label><label>Password<input type="password" minlength="6" required placeholder="At least 6 characters"></label><label class="check"><input type="checkbox" required> I agree to the terms and privacy policy.</label><button class="btn btn-primary" type="submit">Create account <i class="ri-arrow-right-line"></i></button><p class="auth-message" id="signup-message"></p></form><div class="auth-switch">Already have an account? <a href="login.html">Login</a></div></div><a href="index.html" class="back-link">← Return to website</a></main><script src="main.js"></script><script src="enhancements.js" defer></script></body></html>
